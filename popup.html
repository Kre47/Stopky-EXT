<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopky</title>
  <style>
    body {
      min-width: 220px;
      padding: 16px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #time {
      margin: 16px 0;
      font-size: 32px;
      font-variant-numeric: tabular-nums;
    }

    button {
      margin: 4px;
      padding: 8px 12px;
      cursor: pointer;
    }

    #message {
      min-height: 1em;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Stopky pro aktivitu</h1>

  <div id="time">00:00</div>

  <button id="toggleButton" type="button">Start</button>

  <button id="resetButton" type="button">Reset</button>

  <button id="sendButton" type="button">Send to Web</button>

  <p id="message" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
